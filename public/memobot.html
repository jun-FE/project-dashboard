<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모봇</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1f1f1c; --muted:#6b6a64; --line:#e4e1d8; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecebe6; --muted:#a3a19a; --line:#2e2d29; --accent:#7cc2ad; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  ul { padding-left:20px; }
  footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>메모봇</h1>
  <p class="lead">한 사람이 자기 메모와 일정을 관리하려고 만든 개인용 텔레그램 봇입니다. 다른 사용자에게 제공하는 서비스가 아닙니다.</p>
  <p>하는 일</p>
  <ul>
    <li>텔레그램으로 보낸 메모를 저장하고 검색합니다.</li>
    <li>메모를 카테고리별로 정리하고, 할 일과 일정을 알려줍니다.</li>
    <li>메모에서 나온 일정을 운영자 본인의 구글 캘린더에 등록하고, 일정 시작 전에 텔레그램으로 알림을 보냅니다.</li>
  </ul>
  <footer>
    <a href="/privacy.html">개인정보처리방침</a> · 문의: craftttime@gmail.com
  </footer>
</main>
</body>
</html>
